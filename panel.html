<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Panel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- En-tête du Panel -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex items-center justify-between shadow-xl">
            <div>
                <h1 class="text-xl font-black text-white uppercase tracking-wider">Panneau d'Administration</h1>
                <p id="user-role-display" class="text-xs text-slate-400 mt-1">Connecté en tant que Staff</p>
            </div>
            <button onclick="deconnexion()" class="px-4 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold text-xs rounded-xl transition-all border border-rose-500/30 cursor-pointer">
                Se déconnecter
            </button>
        </div>

        <!-- Tes autres modules du panel (Maintenance, etc.) iront ici -->
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Sécurité : Vérifier si l'utilisateur est bien connecté
            if (localStorage.getItem('crackfr_logged_in') !== 'true') {
                window.location.href = 'login.html';
                return;
            }

            // Afficher le rôle actuel
            const role = localStorage.getItem('crackfr_role') || 'Staff';
            document.getElementById('user-role-display').innerText = `Connecté en tant que : ${role}`;
        });

        function deconnexion() {
            localStorage.removeItem('crackfr_logged_in');
            localStorage.removeItem('crackfr_role');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
