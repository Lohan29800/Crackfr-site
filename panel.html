<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Panel Administration ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { opacity: 0; transition: opacity 0.3s ease-in-out; }</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <header class="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
            <div class="text-center sm:text-left space-y-1">
                <h1 class="text-xl font-black text-white uppercase tracking-wider flex items-center justify-center sm:justify-start gap-2">
                    <span>⚡</span> Panel Admin
                </h1>
                <p id="user-role-display" class="text-xs font-bold text-pink-400">Chargement...</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <a href="index.html" class="flex-1 sm:flex-initial px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl transition-all border border-slate-700 text-center">
                    Accueil
                </a>
                <button onclick="deconnexion()" class="flex-1 sm:flex-initial px-4 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold text-xs rounded-xl transition-all border border-rose-500/30 cursor-pointer">
                    Déconnexion
                </button>
            </div>
        </header>

        <!-- Modules de contrôle -->
        <main class="space-y-4">
            
            <!-- Module Maintenance -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-white flex items-center gap-2">
                        <span>🛠️</span> Mode Maintenance Global
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">Bloque l'accès au site pour les visiteurs.</p>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between">
                    <span id="maintenance-status" class="text-xs font-bold text-emerald-400">Actif</span>
                    <button onclick="basculerMaintenance()" class="px-4 py-2.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold rounded-xl transition-all cursor-pointer">
                        Activer / Désactiver
                    </button>
                </div>
            </section>

            <!-- Module Annonce -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-3 shadow-xl">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-white flex items-center gap-2">
                        <span>📢</span> Annonce Globale
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">Diffuse un message sur l'accueil.</p>
                </div>
                <div class="space-y-2">
                    <input type="text" id="annonce-input" placeholder="Message d'information..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-pink-500">
                    <div class="flex gap-2">
                        <button onclick="publierAnnonce()" class="flex-1 py-2.5 bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all cursor-pointer">
                            Publier
                        </button>
                        <button onclick="effacerAnnonce()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition-all cursor-pointer">
                            Retirer
                        </button>
                    </div>
                </div>
            </section>

        </main>

    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1548843091983859722/anp_53peUXEiqxdAah6vlYTroW4bSnDerdtdszI0OzSjh2e1eeemJ73gQsylsuXhOWOh";
        let staffIP = "IP Inconnue";
        let currentRole = "Staff";

        window.addEventListener('DOMContentLoaded', async () => {
            document.body.style.opacity = '1';

            if (localStorage.getItem('crackfr_logged_in') !== 'true') {
                window.location.href = 'login.html';
                return;
            }

            currentRole = localStorage.getItem('crackfr_role') || 'Staff';
            document.getElementById('user-role-display').innerText = `Connecté : ${currentRole}`;
            mettreAJourUIMaintenance();

            const annonceActuelle = localStorage.getItem('crackfr_annonce');
            if (annonceActuelle) {
                document.getElementById('annonce-input').value = annonceActuelle;
            }

            try {
                let res = await fetch('https://api.ipify.org?format=json');
                let data = await res.json();
                staffIP = data.ip;
            } catch (e) {
                console.error("IP non récupérée");
            }
        });

        function notifierDiscord(action) {
            const date = new Date().toLocaleDateString('fr-FR');
            const heure = new Date().toLocaleTimeString('fr-FR');
            const payload = {
                content: `🛠️ **Action Staff / Panel**\n> **Rôle :** ${currentRole}\n> **Action :** ${action}\n> **IP :** \`${staffIP}\`\n> **Heure :** ${date} à ${heure}`
            };

            const dataStr = JSON.stringify(payload);
            if (navigator.sendBeacon) {
                navigator.sendBeacon(DISCORD_WEBHOOK_URL, new Blob([dataStr], { type: 'application/json' }));
            } else {
                fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: dataStr,
                    mode: 'no-cors'
                }).catch(err => console.error(err));
            }
        }

        function mettreAJourUIMaintenance() {
            const isMaint = localStorage.getItem('crackfr_maintenance') === 'true';
            const status = document.getElementById('maintenance-status');
            if (isMaint) {
                status.innerText = "Actif ⚠️";
                status.className = "text-xs font-bold text-amber-400";
            } else {
                status.innerText = "Inactif ✅";
                status.className = "text-xs font-bold text-emerald-400";
            }
        }

        function basculerMaintenance() {
            const current = localStorage.getItem('crackfr_maintenance') === 'true';
            const nextVal = !current;
            localStorage.setItem('crackfr_maintenance', nextVal.toString());
            mettreAJourUIMaintenance();
            notifierDiscord(nextVal ? "Activation du Mode Maintenance 🔒" : "Désactivation du Mode Maintenance 🟢");
        }

        function publierAnnonce() {
            const val = document.getElementById('annonce-input').value.trim();
            if (!val) return;
            localStorage.setItem('crackfr_annonce', val);
            notifierDiscord(`Publication d'une annonce : "${val}"`);
            alert("Annonce publiée !");
        }

        function effacerAnnonce() {
            localStorage.removeItem('crackfr_annonce');
            document.getElementById('annonce-input').value = '';
            notifierDiscord("Suppression de l'annonce globale");
            alert("Annonce retirée.");
        }

        function deconnexion() {
            localStorage.removeItem('crackfr_logged_in');
            localStorage.removeItem('crackfr_role');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
