<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Panel Staff ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { opacity: 0; transition: opacity 0.4s ease-in-out; }</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-black">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="text-lg font-black tracking-wider text-pink-400">PANEL STAFF</div>
            <div class="flex items-center space-x-3">
                <span id="badge-role" class="px-3 py-1 text-[10px] font-extrabold uppercase bg-pink-500/10 text-pink-400 border border-pink-500/30 rounded-full">Rôle</span>
                <button onclick="deconnexion()" class="px-3.5 py-1.5 text-xs font-bold uppercase tracking-wider bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl transition-all cursor-pointer">
                    🔒 Déconnexion
                </button>
                <a href="index.html" class="px-3.5 py-1.5 text-xs font-bold uppercase tracking-wider bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl">
                    🏠 Accueil
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full space-y-8">
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-white">Gestion des Annonces Flash</h1>
            <p class="text-xs text-slate-400">Publie une annonce pour mettre à jour instantanément la page d'accueil.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
            <div class="space-y-2">
                <label for="inputAnnonce" class="text-xs font-bold uppercase tracking-wider text-slate-300 block">Message :</label>
                <input type="text" id="inputAnnonce" placeholder="Ex: Maintenance en cours..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-pink-500">
            </div>
            <button onclick="envoyerAnnoncePanel()" class="px-6 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider cursor-pointer shadow-lg shadow-pink-600/20">
                ⚡ Publier et Synchroniser
            </button>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Historique des annonces</h2>
            <div id="logs-container" class="space-y-2 text-xs text-slate-400">
                <p class="italic">Aucune annonce récente...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 bg-slate-900">
        <p>&copy; 2026 CrackFR. Tous droits réservés.</p>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('crackfr_logged_in') !== 'true') {
                window.location.href = 'login.html';
                return;
            }
            document.body.style.opacity = '1';
            document.getElementById('badge-role').innerText = localStorage.getItem('crackfr_role') || 'Staff';
            afficherLogs();
        });

        function deconnexion() {
            localStorage.removeItem('crackfr_logged_in');
            localStorage.removeItem('crackfr_role');
            window.location.href = 'login.html';
        }

        function envoyerAnnoncePanel() {
            const inputField = document.getElementById('inputAnnonce');
            if (!inputField) return;
            
            const texteAnnonce = inputField.value.trim();
            if (!texteAnnonce) {
                alert("Veuillez écrire une annonce !");
                return;
            }

            // Sauvegarde directe de l'annonce active pour la page d'accueil
            localStorage.setItem('crackfr_active_flash', texteAnnonce);

            // Gestion de l'historique
            let logs = JSON.parse(localStorage.getItem('crackfr_11_logs') || '[]');
            logs.unshift({
                details: "A publié l'annonce flash : " + texteAnnonce,
                time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
            });
            localStorage.setItem('crackfr_11_logs', JSON.stringify(logs));

            inputField.value = '';
            afficherLogs();
            alert("Annonce publiée et synchronisée avec l'accueil ! ⚡");
        }

        function afficherLogs() {
            const logsContainer = document.getElementById('logs-container');
            const logs = JSON.parse(localStorage.getItem('crackfr_11_logs') || '[]');
            
            if (logs.length === 0) {
                logsContainer.innerHTML = '<p class="italic">Aucune annonce récente...</p>';
                return;
            }

            logsContainer.innerHTML = logs.map(log => `
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                    <span>${log.details}</span>
                    <span class="text-[10px] text-slate-500">${log.time || ''}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
