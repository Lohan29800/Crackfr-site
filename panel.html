<!-- Section Visiteurs en Direct dans le Panel Admin -->
<div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl text-left">
    <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold uppercase tracking-wider text-white flex items-center gap-2">
            👀 Derniers Visiteurs du Site
        </h2>
        <button onclick="viderVisiteurs()" class="text-[10px] bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer">
            Effacer l'historique
        </button>
    </div>

    <!-- Liste dynamique -->
    <div id="visiteurs-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
        <p class="text-xs text-slate-500 italic">Chargement des visiteurs...</p>
    </div>
</div>

<script>
    function chargerVisiteursPanel() {
        const container = document.getElementById('visiteurs-list');
        const visites = JSON.parse(localStorage.getItem('crackfr_visiteurs') || '[]');

        if (visites.length === 0) {
            container.innerHTML = `<p class="text-xs text-slate-500 italic">Aucun visiteur récent enregistré.</p>`;
            return;
        }

        container.innerHTML = visites.map(v => `
            <div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl flex items-center justify-between text-xs">
                <div class="flex items-center gap-2.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <div>
                        <span class="text-white font-bold">Page visitée :</span> 
                        <span class="text-slate-300">${v.page}</span>
                    </div>
                </div>
                <div class="text-slate-400 font-mono text-[11px]">
                    ${v.date} à ${v.time}
                </div>
            </div>
        `).join('');
    }

    function viderVisiteurs() {
        localStorage.removeItem('crackfr_visiteurs');
        chargerVisiteursPanel();
    }

    window.addEventListener('DOMContentLoaded', chargerVisiteursPanel);
</script>
