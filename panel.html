<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Panel Staff 🔐</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { opacity: 0; transition: opacity 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-black">

    <!-- En-tête / Navigation Panel -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="text-lg font-black tracking-wider text-pink-400 flex items-center space-x-2">
                <span>🔐</span>
                <span>PANEL STAFF - CRACKFR</span>
            </div>
            <div class="flex items-center space-x-3">
                <a href="index.html" onclick="playClickSound()" class="px-3.5 py-1.5 text-xs font-bold uppercase tracking-wider bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl transition-all inline-block">
                    🏠 Retour Accueil
                </a>
            </div>
        </div>
    </header>

    <!-- Contenu Principal du Panel -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full space-y-8">
        
        <div class="space-y-2">
            <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Gestion des Annonces Flash</h1>
            <p class="text-xs text-slate-400">Publie une annonce qui s'affichera instantanément en haut de la page d'accueil.</p>
        </div>

        <!-- Formulaire de Publication -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
            <div class="space-y-2">
                <label for="inputAnnonce" class="text-xs font-bold uppercase tracking-wider text-slate-300 block">Message de l'annonce :</label>
                <input type="text" id="inputAnnonce" placeholder="Ex: Maintenance prévue ce soir à 21h sur le serveur..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-pink-500 transition-colors">
            </div>
            <button onclick="envoyerAnnoncePanel(); playClickSound();" class="px-6 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-pink-600/20 cursor-pointer">
                ⚡ Publier et Synchroniser
            </button>
        </div>

        <!-- Historique des actions -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Historique des annonces</h2>
            <div id="logs-container" class="space-y-2 text-xs text-slate-400">
                <p class="italic">Aucune annonce récente...</p>
            </div>
        </div>

    </main>

    <!-- Pied de page -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 bg-slate-900 mt-16">
        <p>&copy; 2026 CrackFR. Tous droits réservés - Espace Staff sécurisé.</p>
    </footer>

    <!-- SCRIPT PANEL -->
    <script>
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        // Fonction pour envoyer et synchroniser l'annonce flash avec la page d'accueil
        function envoyerAnnoncePanel() {
            const inputField = document.getElementById('inputAnnonce');
            if (!inputField) return;
            
            const texteAnnonce = inputField.value.trim();
            if (!texteAnnonce) {
                alert("Veuillez écrire une annonce !");
                return;
            }

            let logs = JSON.parse(localStorage.getItem('crackfr_11_logs') || '[]');
            
            logs.unshift({
                id: 4,
                details: "A publié l'annonce flash : " + texteAnnonce,
                time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
            });
            
            localStorage.setItem('crackfr_11_logs', JSON.stringify(logs));

            inputField.value = '';
            afficherLogs();
            alert("Annonce publiée et synchronisée avec l'accueil ! ⚡");
        }

        // Affiche l'historique dans le panel
        function afficherLogs() {
            const logsContainer = document.getElementById('logs-container');
            const logs = JSON.parse(localStorage.getItem('crackfr_11_logs') || '[]');
            
            if (logs.length === 0) {
                logsContainer.innerHTML = '<p class="italic">Aucune annonce récente...</p>';
                return;
            }

            logsContainer.innerHTML = logs.map(log => `
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                    <span>${log.details}</span>
                    <span class="text-[10px] text-slate-500">${log.time || ''}</span>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '1';
            afficherLogs();
        });
    </script>
</body>
</html>
