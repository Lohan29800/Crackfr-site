<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Panel Administration ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { opacity: 0; transition: opacity 0.4s ease-in-out; }</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8 selection:bg-pink-500 selection:text-black">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- En-tête du Panel -->
        <header class="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
            <div class="text-center sm:text-left space-y-1">
                <h1 class="text-xl font-black text-white uppercase tracking-wider flex items-center justify-center sm:justify-start gap-2">
                    <span>⚡</span> Panneau d'Administration
                </h1>
                <p id="user-role-display" class="text-xs font-bold text-pink-400">Chargement...</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <a href="index.html" class="flex-1 sm:flex-initial px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl transition-all border border-slate-700 text-center">
                    Accueil
                </a>
                <button onclick="deconnexion()" class="flex-1 sm:flex-initial px-4 py-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold text-xs rounded-xl transition-all border border-rose-500/30 cursor-pointer">
                    Déconnexion
                </button>
            </div>
        </header>

        <!-- Module de Maintenance -->
        <main class="grid grid-cols-1 gap-6">
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="space-y-1 text-center sm:text-left">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-white flex items-center justify-center sm:justify-start gap-2">
                        <span>🛠️</span> Mode Maintenance Global
                    </h2>
                    <p class="text-xs text-slate-400">Bloque l'accès au site pour tous les visiteurs extérieurs.</p>
                </div>
                <div class="flex items-center gap-3">
                    <span id="maintenance-status" class="text-xs font-bold text-emerald-400">Actif</span>
                    <button id="maintenance-btn" onclick="basculerMaintenance()" class="px-4 py-2.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold rounded-xl transition-all cursor-pointer">
                        Activer / Désactiver
                    </button>
                </div>
            </section>
        </main>

    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1548843091983859722/anp_53peUXEiqxdAah6vlYTroW4bSnDerdtdszI0OzSjh2e1eeemJ73gQsylsuXhOWOh";
        let staffIP = "IP Inconnue";
        let currentRole = "Staff";

        window.addEventListener('DOMContentLoaded', async () => {
            document.body.style.opacity = '1';

            if (localStorage.getItem('crackfr_logged_in') !== 'true') {
                window.location.href = 'login.html';
                return;
            }

            currentRole = localStorage.getItem('crackfr_role') || 'Staff';
            document.getElementById('user-role-display').innerText = `Connecté en tant que : ${currentRole}`;
            mettreAJourUIMaintenance();

            // Récupération de l'IP du staff sur le panel
            try {
                let response = await fetch('https://api.ipify.org?format=json');
                let data = await response.json();
                staffIP = data.ip;
            } catch (e) {
                console.error("Impossible de récupérer l'IP", e);
            }
        });

        function notifierActionDiscord(actionDescription) {
            const heure = new Date().toLocaleTimeString('fr-FR');
            const date = new Date().toLocaleDateString('fr-FR');

            const payload = {
                content: `🛠️ **Action Staff / Modification du Site**\n> **Rôle :** ${currentRole}\n> **Action :** ${actionDescription}\n> **Adresse IP :** \`${staffIP}\`\n> **Heure :** ${date} à ${heure}`
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true
            })
            .then(response => {
                if (!response.ok) {
                    console.error("Erreur Discord (HTTP):", response.status);
                }
            })
            .catch(err => console.error("Erreur réseau Discord:", err));
        }

        function mettreAJourUIMaintenance() {
            const isMaintenance = localStorage.getItem('crackfr_maintenance') === 'true';
            const statusText = document.getElementById('maintenance-status');
            if (isMaintenance) {
                statusText.innerText = "Mode Maintenance Actif ⚠️";
                statusText.className = "text-xs font-bold text-amber-400";
            } else {
                statusText.innerText = "Site Opérationnel ✅";
                statusText.className = "text-xs font-bold text-emerald-400";
            }
        }

        function basculerMaintenance() {
            const current = localStorage.getItem('crackfr_maintenance') === 'true';
            const nouveauStatut = !current;
            localStorage.setItem('crackfr_maintenance', nouveauStatut.toString());
            
            mettreAJourUIMaintenance();

            // Envoi de la notification avec l'IP sur Discord
            const actionText = nouveauStatut ? "Activation du Mode Maintenance 🔒" : "Désactivation du Mode Maintenance 🟢";
            notifierActionDiscord(actionText);
        }

        function deconnexion() {
            localStorage.removeItem('crackfr_logged_in');
            localStorage.removeItem('crackfr_role');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
