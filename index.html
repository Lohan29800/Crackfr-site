<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Hub Communautaire</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { opacity: 0; transition: opacity 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 transition-all">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="text-lg font-black tracking-wider text-cyan-400 flex items-center space-x-2 hover:scale-105 transition-transform cursor-pointer">
                <span>⚡ CRACKFR</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- Compteur de membres -->
                <div class="hidden sm:flex items-center space-x-2 px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-xs font-bold shadow-lg shadow-emerald-500/5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="online-count">--</span> <span>membres</span>
                </div>

                <!-- Bouton Panel Admin Interactif -->
                <a href="panel.html" class="px-3.5 py-1.5 text-xs font-bold uppercase tracking-wider bg-pink-500/10 hover:bg-pink-500/20 text-pink-400 border border-pink-500/30 rounded-xl transition-all duration-200 hover:scale-105 active:scale-95 shadow-lg shadow-pink-500/10">
                    🔐 Panel
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 space-y-10 max-w-5xl mx-auto w-full">
        
        <!-- Alerte Globale -->
        <div id="alert-banner" class="w-full bg-cyan-500/10 border border-cyan-500/30 px-4 py-3 rounded-2xl flex items-center justify-between text-xs hidden shadow-lg animate-pulse">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                <span id="alert-text" class="font-bold text-cyan-400">Chargement...</span>
            </div>
            <span class="text-slate-400 font-semibold">Annonce</span>
        </div>

        <!-- Hero Section -->
        <div class="text-center space-y-4">
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white">
                Hub Communautaire <span class="text-cyan-400 drop-shadow-[0_0_20px_rgba(6,182,212,0.3)]">CrackFR</span>
            </h1>
            <p class="text-slate-400 max-w-xl mx-auto text-sm sm:text-base">
                Retrouve l'état de nos bots Discord et l'actualité du réseau en direct.
            </p>
        </div>

        <!-- Section des Bots -->
        <div id="poles" class="w-full space-y-6">
            <h2 class="text-xl font-bold uppercase tracking-wider text-cyan-400 flex items-center space-x-2">
                <span>🤖 Statut de nos Bots</span>
            </h2>
            <div id="bots-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Chargement dynamique -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 bg-slate-900">
        <p>&copy; 2026 CrackFR. Tous droits réservés.</p>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            document.body.style.opacity = '1';

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Fichier introuvable");

                const data = await response.json();

                if (data.siteMode === 'maintenance') {
                    window.location.href = 'maintenance.html';
                    return;
                }

                document.getElementById('online-count').innerText = data.onlineMembers;

                if (data.globalAlert) {
                    document.getElementById('alert-text').innerText = data.globalAlert;
                    document.getElementById('alert-banner').classList.remove('hidden');
                }

                const grid = document.getElementById('bots-grid');
                grid.innerHTML = "";

                data.bots.forEach(bot => {
                    let badgeClass = "px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-bold rounded-full border border-emerald-500/30";
                    if (bot.status === 'Maintenance') {
                        badgeClass = "px-2.5 py-1 bg-amber-500/10 text-amber-400 text-xs font-bold rounded-full border border-amber-500/30";
                    } else if (bot.status === 'Hors Ligne') {
                        badgeClass = "px-2.5 py-1 bg-rose-500/10 text-rose-400 text-xs font-bold rounded-full border border-rose-500/30";
                    }

                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3 shadow-xl hover:border-cyan-500/50 hover:shadow-cyan-500/5 transition-all duration-300 hover:-translate-y-1";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-sm text-white">${escapeHtml(bot.name)}</h3>
                            <span class="${badgeClass}">${escapeHtml(bot.status)}</span>
                        </div>
                        <p class="text-xs text-slate-400">${escapeHtml(bot.desc)}</p>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.log("Erreur de chargement du JSON ou mode local.");
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
