<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Accueil ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Bannière d'annonce globale -->
    <div id="global-banner" class="hidden max-w-2xl mx-auto w-full bg-pink-600/20 border border-pink-500/40 p-4 rounded-2xl text-pink-300 text-xs font-bold text-center shadow-lg mb-4">
        📢 <span id="banner-text"></span>
    </div>

    <main class="max-w-2xl mx-auto w-full space-y-6 my-auto text-center">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl space-y-4">
            <h1 class="text-2xl font-black text-white uppercase tracking-wider">CrackFR ⚡</h1>
            <p class="text-xs text-slate-400">Bienvenue sur le portail officiel. Accès réservé aux membres autorisés.</p>
            
            <div class="pt-4 flex justify-center gap-3">
                <a href="login.html" class="px-6 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg shadow-pink-600/20">
                    Portail Staff (Login)
                </a>
            </div>
        </div>
    </main>

    <footer class="text-center text-[10px] text-slate-600 uppercase tracking-widest">
        CrackFR © 2026 - Tous droits réservés
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const annonce = localStorage.getItem('crackfr_annonce');
            if (annonce) {
                document.getElementById('banner-text').innerText = annonce;
                document.getElementById('global-banner').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
