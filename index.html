<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Hub Communautaire</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="text-lg font-black tracking-wider text-cyan-400">
                CRACKFR
            </div>
            
            <!-- Compteur de membres fixe (modifiable ici directement) -->
            <div class="flex items-center space-x-4 text-xs font-bold text-slate-400">
                <div class="flex items-center space-x-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 rounded-full text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>42</span> <span>membres</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 space-y-12 max-w-5xl mx-auto w-full">
        
        <!-- Hero Section -->
        <div class="text-center space-y-4">
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white">
                Hub Communautaire <span class="text-cyan-400">CrackFR</span>
            </h1>
            <p class="text-slate-400 max-w-xl mx-auto text-sm sm:text-base">
                Retrouve l'état de nos bots Discord et rejoins la communauté.
            </p>
        </div>

        <!-- Section des Bots (Modifie tes bots directement ici) -->
        <div id="poles" class="w-full space-y-6">
            <h2 class="text-xl font-bold uppercase tracking-wider text-cyan-400">🤖 Statut de nos Bots</h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                
                <!-- BOT 1 -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-white">🤖 Bot Discord (GLaDOS)</h3>
                        <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-bold rounded-full border border-emerald-500/30">Opérationnel</span>
                    </div>
                    <p class="text-xs text-slate-400">Modération & IA intelligente</p>
                </div>

                <!-- BOT 2 -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-white">🤖 Bot Musique</h3>
                        <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-bold rounded-full border border-emerald-500/30">Opérationnel</span>
                    </div>
                    <p class="text-xs text-slate-400">Audio haute qualité & DisTube</p>
                </div>

                <!-- Tu peux rajouter d'autres bots en copiant un bloc ci-dessus -->

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 bg-slate-900">
        <p>&copy; 2026 CrackFR. Tous droits réservés.</p>
    </footer>

</body>
</html>
