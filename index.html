    <script>
        let validKeys = JSON.parse(localStorage.getItem("crackfr_keys")) || ["crackfr2026"];
        let linkedUsers = [];
        
        const overlay = document.getElementById("admin-modal-overlay");
        const openBtn = document.getElementById("open-admin-btn");
        const closeBtn = document.getElementById("close-admin-btn");
        const staffForm = document.getElementById("staff-form");
        const loginView = document.getElementById("login-view");
        const dashboardView = document.getElementById("dashboard-view");
        const logoutBtn = document.getElementById("logout-btn");
        const logsBox = document.getElementById("admin-logs");

        // Charger les membres depuis la base de données PostgreSQL via l'API
        async function fetchLinkedUsers() {
            try {
                const response = await fetch('/api/users');
                linkedUsers = await response.json();
                renderPublicLinkedUsers();
            } catch (err) {
                console.error("Erreur lors de la récupération des membres :", err);
            }
        }

        // Affichage dynamique des utilisateurs liés sur la page d'accueil
        function renderPublicLinkedUsers() {
            const container = document.getElementById("public-linked-users");
            container.innerHTML = "";
            if(!linkedUsers || linkedUsers.length === 0) {
                container.innerHTML = `<p style="font-size: 0.75rem; color: #94a3b8;">Aucun membre lié pour le moment.</p>`;
                return;
            }
            linkedUsers.forEach((user) => {
                container.innerHTML += `
                    <div class="linked-user-card">
                        <div class="linked-user-info">
                            <span>Membre Officiel</span>
                            <strong>${user.name}</strong>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span class="role-badge">${user.role}</span>
                            ${sessionStorage.getItem("admin_logged") === "true" ? `<button onclick="removeLinkedUser(${user.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.7rem;">✕</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        // Charger les utilisateurs dès le chargement de la page
        fetchLinkedUsers();

        // Gestion de l'ouverture de la modale
        openBtn.addEventListener("click", (e) => {
            e.preventDefault();
            overlay.classList.add("show");
            if (sessionStorage.getItem("admin_logged") === "true") {
                loginView.style.display = "none";
                dashboardView.classList.add("active");
                fetchLinkedUsers();
            } else {
                loginView.style.display = "block";
                dashboardView.classList.remove("active");
            }
        });

        closeBtn.addEventListener("click", () => overlay.classList.remove("show"));
        overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("show"); });

        staffForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const val = document.getElementById("staff-password").value.trim();
            const msg = document.getElementById("login-msg");

            if (validKeys.includes(val)) {
                msg.style.color = "#34d399";
                msg.innerText = "Accès autorisé !";
                sessionStorage.setItem("admin_logged", "true");
                addLog(`Connexion réussie.`);
                
                setTimeout(() => {
                    loginView.style.display = "none";
                    dashboardView.classList.add("active");
                    document.getElementById("staff-password").value = "";
                    msg.innerText = "";
                    fetchLinkedUsers();
                }, 400);
            } else {
                msg.style.color = "#f472b6";
                msg.innerText = "Clé incorrecte !";
            }
        });

        logoutBtn.addEventListener("click", () => {
            sessionStorage.removeItem("admin_logged");
            dashboardView.classList.remove("active");
            loginView.style.display = "block";
            fetchLinkedUsers();
            addLog(`Déconnexion.`);
        });

        function addLog(text) {
            const time = new Date().toLocaleTimeString();
            logsBox.innerHTML += `<span>[${time}] ${text}</span>`;
            logsBox.scrollTop = logsBox.scrollHeight;
        }

        // Ajouter une personne liée à l'accueil via l'API (Neon DB)
        document.getElementById("link-user-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("link-username").value.trim();
            const role = document.getElementById("link-role").value;

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, role })
                });

                if (response.ok) {
                    await fetchLinkedUsers();
                    addLog(`🔗 Membre lié à l'accueil : ${name} (${role})`);
                    alert(`Le membre ${name} a été enregistré dans la base de données !`);
                    document.getElementById("link-username").value = "";
                } else {
                    alert("Erreur lors de l'enregistrement.");
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
            }
        });

        // Supprimer un membre de la base de données
        async function removeLinkedUser(id) {
            try {
                const response = await fetch(`/api/users/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await fetchLinkedUsers();
                    addLog(`🗑️ Membre retiré de la base de données (ID: ${id})`);
                } else {
                    alert("Erreur lors de la suppression.");
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
            }
        }

        // Maintenance
        document.getElementById("maintenance-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const reason = document.getElementById("maintenance-reason").value.trim();
            document.getElementById("maint-status").innerText = "Actif 🔴";
            document.getElementById("maint-status").style.color = "#f43f5e";
            document.getElementById("status-display").innerText = "Maintenance 🛠️";
            document.getElementById("status-display").style.color = "#f43f5e";
            addLog(`🚨 Maintenance activée. Raison : "${reason}"`);
            alert("Maintenance activée !");
        });

        document.getElementById("disable-maint").addEventListener("click", () => {
            document.getElementById("maint-status").innerText = "Désactivé";
            document.getElementById("maint-status").style.color = "#94a3b8";
            document.getElementById("status-display").innerText = "En Ligne 🟢";
            document.getElementById("status-display").style.color = "#34d399";
            document.getElementById("maintenance-reason").value = "";
            addLog(`✅ Maintenance désactivée.`);
            alert("Maintenance désactivée !");
        });

        // Gestion des clés
        function updateKeysUI() {
            const container = document.getElementById("keys-container");
            container.innerHTML = "";
            validKeys.forEach(key => {
                container.innerHTML += `
                    <div class="key-item">
                        <span><code>${key}</code></span>
                        <span style="font-size:0.55rem; color:#f472b6;">Actif</span>
                    </div>
                `;
            });
            document.getElementById("keys-count").innerText = validKeys.length;
        }
        updateKeysUI();

        function executeSanction() {
            const target = document.getElementById("target-user").value.trim();
            const type = document.getElementById("sanction-type").value;
            if(!target) { alert("Entrer un pseudo !"); return; }
            addLog(`⚡ Sanction [${type}] sur : ${target}`);
            alert(`Sanction ${type} appliquée à ${target}`);
            document.getElementById("target-user").value = "";
        }
    </script>
