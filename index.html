<!-- ========================================== -->
<!-- PANEL DE MAINTENANCE MODULAIRE             -->
<!-- ========================================== -->
<div id="maintenance-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#020005]/95 backdrop-blur-2xl transition-all duration-500 hidden">
    
    <!-- ARRIÈRE-PLAN LUMINEUX AMBIANT -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-pink-600/20 rounded-full blur-[130px]"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-[130px]"></div>
    </div>

    <!-- CONTENEUR PRINCIPAL -->
    <div class="max-w-xl w-full bg-slate-900/90 backdrop-blur-2xl p-6 sm:p-8 rounded-3xl border border-pink-500/40 shadow-2xl space-y-6 relative z-10">
        
        <!-- BARRE DÉCORATIVE SUPÉRIEURE -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 rounded-t-3xl"></div>

        <!-- EN-TÊTE -->
        <div class="text-center space-y-3">
            <div class="w-14 h-14 bg-pink-500/10 border border-pink-500/40 rounded-2xl flex items-center justify-center text-pink-400 text-2xl mx-auto animate-bounce shadow-[0_0_20px_rgba(255,0,127,0.3)]">
                🛡️
            </div>
            <div class="space-y-1">
                <span class="px-3 py-1 bg-pink-500/10 border border-pink-500/30 text-pink-400 text-[10px] font-black uppercase tracking-widest rounded-full">Système Verrouillé</span>
                <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-wider text-white">Maintenance en Cours</h1>
            </div>
            <p class="text-xs sm:text-sm text-slate-300 max-w-md mx-auto leading-relaxed bg-slate-950/80 p-3.5 rounded-2xl border border-pink-500/20">
                Le portail fait peau neuve. Saisis ta clé d'accès staff ou valide le mini-jeu pour contourner la maintenance.
            </p>
        </div>

        <!-- COMPTE À REBOURS -->
        <div class="grid grid-cols-4 gap-2 text-center">
            <div class="bg-slate-950/90 border border-pink-500/30 p-2.5 rounded-2xl">
                <span id="m-hours" class="text-lg sm:text-xl font-black text-pink-400 font-mono">02</span>
                <span class="block text-[9px] uppercase tracking-wider text-slate-400 font-bold mt-0.5">Heures</span>
            </div>
            <div class="bg-slate-950/90 border border-pink-500/30 p-2.5 rounded-2xl">
                <span id="m-minutes" class="text-lg sm:text-xl font-black text-pink-400 font-mono">45</span>
                <span class="block text-[9px] uppercase tracking-wider text-slate-400 font-bold mt-0.5">Minutes</span>
            </div>
            <div class="bg-slate-950/90 border border-pink-500/30 p-2.5 rounded-2xl">
                <span id="m-seconds" class="text-lg sm:text-xl font-black text-pink-400 font-mono">30</span>
                <span class="block text-[9px] uppercase tracking-wider text-slate-400 font-bold mt-0.5">Secondes</span>
            </div>
            <div class="bg-slate-950/90 border border-purple-500/30 p-2.5 rounded-2xl">
                <span class="text-lg sm:text-xl font-black text-purple-400 font-mono">75%</span>
                <span class="block text-[9px] uppercase tracking-wider text-slate-400 font-bold mt-0.5">Statut</span>
            </div>
        </div>

        <!-- CONNEXION STAFF PAR CLÉ -->
        <div class="bg-slate-950/80 p-4 rounded-2xl border border-pink-500/30 space-y-2.5">
            <h3 class="text-xs font-black uppercase tracking-widest text-pink-400 flex items-center justify-between">
                <span>🔑 Connexion Staff</span>
                <span class="text-[10px] text-slate-500 font-mono">Master Key</span>
            </h3>
            <form onsubmit="unlockSite(event)" class="flex gap-2">
                <input type="password" id="staff-password" placeholder="Entrer la clé..." required class="flex-1 bg-slate-900 border border-pink-500/30 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-pink-400 font-mono">
                <button type="submit" class="px-4 py-2.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-xs font-extrabold rounded-xl text-white cursor-pointer uppercase tracking-wider transition-all">Valider</button>
            </form>
            <p id="maintenance-msg" class="text-[11px] font-bold text-center h-4 text-slate-400"></p>
        </div>

        <!-- LIENS & MINI-JEU -->
        <div class="flex flex-wrap items-center justify-between pt-1 border-t border-slate-800 text-xs">
            <a href="https://discord.gg" target="_blank" class="text-indigo-400 hover:underline font-bold flex items-center gap-1">💬 Discord Staff</a>
            <button onclick="toggleGame()" class="text-cyan-400 hover:underline font-bold">🕹️ Mini-jeu d'accès</button>
        </div>

        <!-- MINI-JEU -->
        <div id="game-box" class="hidden space-y-2.5 bg-slate-950 p-3.5 rounded-2xl border border-cyan-500/40">
            <h4 class="text-xs font-black text-cyan-400 uppercase tracking-widest text-center">Devine le chiffre (1 à 5)</h4>
            <div class="flex justify-center gap-2">
                <input type="number" id="game-input" min="1" max="5" placeholder="?" class="w-20 text-center bg-slate-900 border border-cyan-500/40 rounded-xl py-2 text-xs font-bold text-white focus:outline-none font-mono">
                <button onclick="checkGame()" class="px-3.5 py-2 bg-cyan-600 hover:bg-cyan-500 text-xs font-extrabold rounded-xl text-white transition-all">Tester</button>
            </div>
            <p id="game-msg" class="text-center text-[11px] font-bold text-slate-300">Tente ta chance !</p>
        </div>

    </div>
</div>

<!-- SCRIPT DE GESTION -->
<script>
    // ⚙️ INTERRUPTEUR DE MAINTENANCE (True = Actif pour tous | False = Désactivé)
    const MAINTENANCE_ACTIVE = true;
    const CORRECT_PASS = "crackfr2026";

    // Gestion de l'affichage du panel
    window.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById("maintenance-overlay");
        const isUnlocked = localStorage.getItem("site_unlocked") === "true";

        if (MAINTENANCE_ACTIVE && !isUnlocked) {
            overlay.classList.remove("hidden");
        } else {
            overlay.classList.add("hidden");
        }
    });

    function unlockSite(e) {
        e.preventDefault();
        const val = document.getElementById("staff-password").value.trim();
        const msg = document.getElementById("maintenance-msg");

        if (val === CORRECT_PASS) {
            msg.className = "text-[11px] font-bold text-emerald-400 text-center h-4";
            msg.innerText = "Accès autorisé ! Redirection...";
            localStorage.setItem("site_unlocked", "true");
            setTimeout(() => {
                document.getElementById("maintenance-overlay").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("maintenance-overlay").classList.add("hidden");
                }, 500);
            }, 800);
        } else {
            msg.className = "text-[11px] font-bold text-pink-400 text-center h-4";
            msg.innerText = "Clé incorrecte !";
        }
    }

    function toggleGame() {
        document.getElementById("game-box").classList.toggle("hidden");
    }

    let targetNum = Math.floor(Math.random() * 5) + 1;
    function checkGame() {
        const guess = parseInt(document.getElementById("game-input").value);
        const gMsg = document.getElementById("game-msg");
        if (guess === targetNum) {
            gMsg.innerText = "🎉 Gagnant ! Déverrouillage...";
            localStorage.setItem("site_unlocked", "true");
            setTimeout(() => {
                document.getElementById("maintenance-overlay").classList.add("hidden");
            }, 1000);
        } else {
            gMsg.innerText = guess < targetNum ? "C'est plus haut 📈" : "C'est plus bas 📉";
        }
    }

    // Compte à rebours automatique
    let tSecs = 7230;
    setInterval(() => {
        if (tSecs > 0) tSecs--;
        let h = Math.floor(tSecs / 3600);
        let m = Math.floor((tSecs % 3600) / 60);
        let s = tSecs % 60;
        const hEl = document.getElementById('m-hours');
        const mEl = document.getElementById('m-minutes');
        const sEl = document.getElementById('m-seconds');
        if(hEl) hEl.innerText = String(h).padStart(2, '0');
        if(mEl) mEl.innerText = String(m).padStart(2, '0');
        if(sEl) sEl.innerText = String(s).padStart(2, '0');
    }, 1000);
</script>
