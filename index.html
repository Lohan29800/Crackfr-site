<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Serveur Communautaire & Gaming ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { opacity: 0; transition: opacity 0.4s ease-in-out; }</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-black">

    <!-- Bandeau d'annonce flash synchronisé -->
    <div id="flash-banner" class="hidden bg-pink-600/10 border-b border-pink-500/30 text-pink-400 px-4 py-2.5 text-xs font-bold text-center flex items-center justify-center space-x-2 animate-pulse">
        <span>⚡ Annonce Staff :</span>
        <span id="flash-text" class="text-slate-200"></span>
    </div>

    <!-- En-tête -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="text-lg font-black tracking-wider text-pink-400">CRACKFR</div>
            <div class="flex items-center space-x-3">
                <a href="login.html" class="px-3.5 py-1.5 text-xs font-bold uppercase tracking-wider bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl transition-all">
                    🔐 Panel Staff
                </a>
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-16 text-center space-y-6">
        <h1 class="text-5xl font-black text-white">Bienvenue sur <span class="text-pink-500">CrackFR</span></h1>
        <p class="text-slate-400 text-sm">Serveur communautaire et gaming actif.</p>
        <a href="https://discord.gg/25XdSrFQve" target="_blank" class="inline-block px-7 py-4 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-2xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-pink-600/20">
            💬 Rejoindre le Discord
        </a>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 bg-slate-900">
        <p>&copy; 2026 CrackFR. Tous droits réservés.</p>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '1';

            // Synchronisation de l'annonce flash en temps réel
            try {
                const annonceActuelle = localStorage.getItem('crackfr_active_flash');
                if (annonceActuelle) {
                    const banner = document.getElementById('flash-banner');
                    const flashText = document.getElementById('flash-text');
                    if(flashText) flashText.innerText = annonceActuelle;
                    if(banner) banner.classList.remove('hidden');
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
