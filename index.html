<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6 flex flex-col justify-between">

    <!-- Barre du haut -->
    <div class="max-w-xl mx-auto w-full flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
        <span class="text-xs font-bold text-emerald-400">● En ligne</span>
        <button onclick="toggleAudio()" id="play-btn" class="px-3 py-1.5 bg-pink-600/20 text-pink-400 border border-pink-500/30 text-xs font-bold rounded-lg">
            🎵 Lancer la musique
        </button>
        <audio id="audio-player" loop></audio>
    </div>

    <!-- Contenu principal -->
    <div class="max-w-xl mx-auto w-full space-y-4 text-center my-auto">
        
        <!-- Bannière annonce -->
        <div id="banner" class="hidden bg-pink-950/40 border border-pink-500/30 p-3 rounded-xl text-pink-300 text-xs font-bold">
            📢 <span id="banner-content"></span>
        </div>

        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 space-y-4">
            <h1 class="text-3xl font-black uppercase tracking-wider text-white">CrackFR ⚡</h1>
            <p class="text-xs text-slate-400">Bienvenue sur le portail de la communauté.</p>
            <div class="pt-2 flex justify-center gap-3">
                <a href="login.html" class="px-4 py-2 bg-pink-600 text-xs font-bold rounded-lg uppercase">Panel Admin</a>
                <a href="https://discord.com" target="_blank" class="px-4 py-2 bg-slate-800 text-xs font-bold rounded-lg uppercase">Discord</a>
            </div>
        </div>
    </div>

    <footer class="text-center text-[10px] text-slate-600 uppercase">
        CrackFR 2026
    </footer>

    <script>
        window.onload = () => {
            // Afficher l'annonce si elle existe
            const ann = localStorage.getItem('annonce');
            if(ann) {
                document.getElementById('banner-content').innerText = ann;
                document.getElementById('banner').classList.remove('hidden');
            }

            // Charger la musique active
            const list = JSON.parse(localStorage.getItem('playlist') || JSON.stringify([
                {name: "Ambiance Café", src: "https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg"}
            ]));
            const active = localStorage.getItem('active_m') || '0';
            const track = list[active] || list[0];
            const player = document.getElementById('audio-player');
            player.src = track.src;
            document.getElementById('play-btn').innerText = "🎵 " + track.name;
        }

        function toggleAudio() {
            const player = document.getElementById('audio-player');
            const btn = document.getElementById('play-btn');
            if(player.paused) {
                player.play().then(() => {
                    btn.innerText = "⏸️ Pause";
                }).catch(() => {
                    alert("Clique une deuxième fois pour autoriser la lecture.");
                });
            } else {
                player.pause();
                btn.innerText = "🎵 Reprendre";
            }
        }
    </script>
</body>
</html>
