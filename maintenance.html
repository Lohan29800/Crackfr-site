<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Maintenance en cours</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: { cyan: '#00f3ff', purple: '#b026ff', pink: '#ff007f', bg: '#05050a', card: '#0a0a16', border: '#1a1a3a' }
                    },
                    boxShadow: { 'neon-pink': '0 0 25px rgba(255, 0, 127, 0.4)' }
                }
            }
        }
    </script>
</head>
<body class="bg-neon-bg text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="max-w-md w-full bg-neon-card border border-neon-border p-8 rounded-3xl shadow-2xl relative space-y-6">

        <div class="space-y-2">
            <span class="text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan via-neon-purple to-neon-pink">
                CRACKFR
            </span>
            <h1 class="text-lg font-bold text-white pt-2">🔧 Maintenance Technique</h1>
            <p class="text-xs text-slate-400 leading-relaxed">
                Nos serveurs subissent des optimisations pour vous offrir une meilleure expérience de jeu. Revenez très vite !
            </p>
        </div>

        <div class="p-4 bg-slate-900/60 border border-neon-border rounded-2xl">
            <div class="flex items-center justify-center space-x-2 text-xs font-bold text-amber-400">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
                <span>Statut : Mise à jour en cours</span>
            </div>
        </div>

        <div class="pt-4 border-t border-neon-border flex flex-col gap-2">
            <a href="panel.html" class="w-full py-3 bg-neon-pink/10 hover:bg-neon-pink/20 text-neon-pink border border-neon-pink/30 rounded-xl text-xs font-bold transition-all shadow-neon-pink">
                🔐 Accéder au Panel Admin
            </a>
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
                ← Tenter de retourner à l'accueil

        </div>
    </div>

</html>
