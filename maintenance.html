<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Site en Maintenance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4 selection:bg-rose-500 selection:text-black">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center space-y-6 shadow-2xl">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-3xl animate-pulse">
            🛠️
        </div>
        
        <div class="space-y-2">
            <h1 class="text-2xl font-black tracking-tight text-white">Maintenance en cours</h1>
            <p id="maintenance-reason" class="text-xs sm:text-sm text-slate-400">
                Le hub CrackFR est actuellement indisponible pour cause de maintenance et de mises à jour.
            </p>
        </div>

        <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-400 space-y-1">
            <p class="font-bold text-slate-300">Statut du Réseau</p>
            <p class="text-rose-400 font-bold">● Accès temporairement restreint</p>
        </div>

        <button onclick="checkStatus()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs transition-all border border-slate-700">
            🔄 Vérifier si le site est de retour
        </button>
    </div>

    <footer class="absolute bottom-6 text-xs text-slate-600">
        &copy; 2026 CrackFR. Tous droits réservés.
    </footer>

    <script>
        // Charger la raison de la maintenance personnalisée si définie dans le panel
        window.addEventListener('DOMContentLoaded', () => {
            const customReason = localStorage.getItem('crackfr_maintenance_reason');
            if (customReason) {
                document.getElementById('maintenance-reason').innerText = customReason;
            }
        });

        // Bouton pour retenter l'accès
        function checkStatus() {
            const mode = localStorage.getItem('crackfr_site_mode');
            if (mode === 'active') {
                window.location.href = 'index.html';
            } else {
                alert("Le site est toujours en maintenance. Revenez un peu plus tard !");
            }
        }
    </script>
</body>
</html>
