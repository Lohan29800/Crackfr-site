<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Ultime - CrackFR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 sm:p-6 flex flex-col justify-between selection:bg-pink-600 selection:text-white">

    <div class="max-w-2xl mx-auto w-full space-y-6">
        
        <!-- Top bar -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
            <a href="index.html" class="text-xs text-pink-400 font-bold hover:underline">← Retour au site</a>
            <h1 class="text-xs font-black uppercase tracking-wider text-white">⚡ Administration CrackFR</h1>
        </div>

        <!-- 1. Écran de Connexion -->
        <div id="login-box" class="bg-slate-900 p-8 rounded-3xl border border-slate-800 space-y-4 shadow-xl">
            <h2 class="text-sm font-bold uppercase text-center tracking-wider">Connexion Staff</h2>
            <form onsubmit="login(event)" class="space-y-3">
                <input type="text" id="user" placeholder="Identifiant (admin)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs focus:border-pink-500 focus:outline-none">
                <input type="password" id="pass" placeholder="Mot de passe (crackfr2026)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs focus:border-pink-500 focus:outline-none">
                <button type="submit" class="w-full py-3 bg-pink-600 hover:bg-pink-500 font-extrabold text-xs rounded-xl uppercase tracking-wider transition-all cursor-pointer shadow-lg shadow-pink-600/20">Se connecter</button>
            </form>
            <p id="err" class="text-red-400 text-xs text-center hidden font-bold">Identifiants incorrects.</p>
        </div>

        <!-- 2. Dashboard Complet (Caché par défaut) -->
        <div id="dashboard" class="hidden space-y-6">
            
            <!-- MODULE 1 : STATUT DU SERVEUR & STATS -->
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4 shadow-xl">
                <h2 class="text-xs font-black uppercase tracking-wider text-pink-400">🟢 Statut & Statistiques du Site</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">État du serveur :</label>
                        <select id="server-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
                            <option value="online">En Ligne (Actif)</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="full">Complet</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Joueurs connectés :</label>
                        <input type="text" id="server-players" placeholder="ex: 42 / 64" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Membres Discord (ex: 1.2K+) :</label>
                        <input type="text" id="stat-members" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Latence (ex: 15ms) :</label>
                        <input type="text" id="stat-ping" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    </div>
                </div>
                <button onclick="saveGlobalStats()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">Enregistrer les stats</button>
            </div>

            <!-- MODULE 2 : BANNIÈRE D'ANNONCE -->
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-3 shadow-xl">
                <h2 class="text-xs font-black uppercase tracking-wider text-pink-400">📢 Annonce du site</h2>
                <input type="text" id="annonce-txt" placeholder="Texte de l'alerte/annonce..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                <div class="flex gap-2">
                    <button onclick="saveAnnonce()" class="flex-1 py-2 bg-pink-600 hover:bg-pink-500 text-xs font-bold rounded-xl transition-all cursor-pointer">Publier</button>
                    <button onclick="clearAnnonce()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">Retirer</button>
                </div>
            </div>

            <!-- MODULE 3 : GESTION DES JEUX (Grille Accueil) -->
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4 shadow-xl">
                <h2 class="text-xs font-black uppercase tracking-wider text-pink-400">🎮 Gestion des Univers de Jeu</h2>
                <div class="space-y-2">
                    <input type="text" id="game-emoji" placeholder="Emoji (ex: 🚗)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    <input type="text" id="game-title" placeholder="Nom du jeu (ex: GTA V / FiveM)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    <textarea id="game-desc" rows="2" placeholder="Description courte..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs resize-none"></textarea>
                    <button onclick="addGame()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">Ajouter un jeu</button>
                </div>
                <div id="games-list-admin" class="space-y-2 pt-2 border-t border-slate-800 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- MODULE 4 : GESTIONNAIRE DE MUSIQUE -->
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4 shadow-xl">
                <h2 class="text-xs font-black uppercase tracking-wider text-pink-400">🎵 Gestionnaire de Playlist (Chill)</h2>
                <div class="space-y-2">
                    <input type="text" id="m-name" placeholder="Nom de la musique" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    <input type="url" id="m-url" placeholder="Lien direct MP3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    <button onclick="addLink()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">Ajouter à la playlist</button>
                </div>
                <div id="playlist-list" class="space-y-2 pt-2 border-t border-slate-800 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- MODULE 5 : PUBLIER UNE NEWS -->
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-3 shadow-xl">
                <h2 class="text-xs font-black uppercase tracking-wider text-pink-400">📰 Publier une News / Patch Note</h2>
                <input type="text" id="news-title" placeholder="Titre de la news" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                <textarea id="news-desc" rows="2" placeholder="Description..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs resize-none"></textarea>
                <button onclick="addNews()" class="w-full py-2 bg-pink-600 hover:bg-pink-500 text-xs font-bold rounded-xl transition-all cursor-pointer">Publier la News</button>
                <div id="news-list" class="space-y-2 pt-2 border-t border-slate-800 max-h-32 overflow-y-auto"></div>
            </div>

            <!-- Déconnexion -->
            <button onclick="logout()" class="w-full py-3 bg-red-950/40 border border-red-900/50 hover:bg-red-900/40 text-red-400 text-xs font-extrabold rounded-xl transition-all cursor-pointer">🔒 Se déconnecter</button>
        </div>
    </div>

    <script>
        window.onload = () => {
            if(localStorage.getItem('auth') === '1') showDash();
        }

        function login(e) {
            e.preventDefault();
            if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'crackfr2026') {
                localStorage.setItem('auth', '1');
                showDash();
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        }

        function showDash() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('annonce-txt').value = localStorage.getItem('annonce') || '';
            document.getElementById('server-status').value = localStorage.getItem('srv_status') || 'online';
            document.getElementById('server-players').value = localStorage.getItem('srv_players') || '42 / 64';
            document.getElementById('stat-members').value = localStorage.getItem('stat_members') || '1.2K+';
            document.getElementById('stat-ping').value = localStorage.getItem('stat_ping') || '15ms';
            renderList();
            renderNews();
            renderGamesAdmin();
        }

        function logout() {
            localStorage.removeItem('auth');
            location.reload();
        }

        function saveGlobalStats() {
            localStorage.setItem('srv_status', document.getElementById('server-status').value);
            localStorage.setItem('srv_players', document.getElementById('server-players').value);
            localStorage.setItem('stat_members', document.getElementById('stat-members').value);
            localStorage.setItem('stat_ping', document.getElementById('stat-ping').value);
            alert("Statistiques et statut mis à jour !");
        }

        function saveAnnonce() {
            localStorage.setItem('annonce', document.getElementById('annonce-txt').value);
            alert("Annonce publiée !");
        }
        function clearAnnonce() {
            localStorage.removeItem('annonce');
            document.getElementById('annonce-txt').value = '';
            alert("Annonce retirée.");
        }

        // --- GESTION DES JEUX ---
        function getGames() {
            return JSON.parse(localStorage.getItem('games') || JSON.stringify([
                {emoji: "🚗", title: "GTA V / FiveM", desc: "Plonge dans notre univers Roleplay ou nos sessions chill open-world entre potes."},
                {emoji: "⛏️", title: "Minecraft & Survie", desc: "Un serveur survie / build convivial pour exprimer ta créativité."},
                {emoji: "🎮", title: "Roblox & Communauté", desc: "Des sessions découvertes sur Roblox et des tournois entre membres."}
            ]));
        }
        function renderGamesAdmin() {
            const games = getGames();
            let html = '';
            games.forEach((g, i) => {
                html += `<div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
                    <span class="truncate pr-2 text-white font-bold">${g.emoji} ${g.title}</span>
                    <button onclick="delGame(${i})" class="px-2.5 py-1 bg-red-950/60 text-red-400 rounded-lg cursor-pointer">✕</button>
                </div>`;
            });
            document.getElementById('games-list-admin').innerHTML = html;
        }
        function addGame() {
            const emoji = document.getElementById('game-emoji').value;
            const title = document.getElementById('game-title').value;
            const desc = document.getElementById('game-desc').value;
            if(!emoji || !title || !desc) return alert("Remplis tous les champs du jeu !");
            let games = getGames();
            games.push({emoji, title, desc});
            localStorage.setItem('games', JSON.stringify(games));
            document.getElementById('game-emoji').value = '';
            document.getElementById('game-title').value = '';
            document.getElementById('game-desc').value = '';
            renderGamesAdmin();
        }
        function delGame(i) {
            let games = getGames();
            games.splice(i, 1);
            localStorage.setItem('games', JSON.stringify(games));
            renderGamesAdmin();
        }

        // --- PLAYLIST ---
        function getPl() {
            return JSON.parse(localStorage.getItem('playlist') || JSON.stringify([
                {name: "Lofi Chill & Study", src: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3"}
            ]));
        }
        function savePl(list) {
            localStorage.setItem('playlist', JSON.stringify(list));
            renderList();
        }
        function renderList() {
            const list = getPl();
            const active = localStorage.getItem('active_m') || '0';
            let html = '';
            list.forEach((m, i) => {
                html += `<div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
                    <span class="truncate pr-2 ${i == active ? 'text-pink-400 font-bold' : 'text-slate-300'}">${m.name}</span>
                    <div class="flex gap-1 shrink-0">
                        <button onclick="localStorage.setItem('active_m', ${i}); renderList(); alert('Musique active !');" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg cursor-pointer">Activer</button>
                        <button onclick="let l=getPl(); l.splice(${i},1); savePl(l);" class="px-2.5 py-1 bg-red-950/60 text-red-400 rounded-lg cursor-pointer">✕</button>
                    </div>
                </div>`;
            });
            document.getElementById('playlist-list').innerHTML = html;
        }
        function addLink() {
            const name = document.getElementById('m-name').value;
            const src = document.getElementById('m-url').value;
            if(!name || !src) return alert("Remplis tous les champs !");
            let list = getPl();
            list.push({name, src});
            savePl(list);
            document.getElementById('m-name').value = '';
            document.getElementById('m-url').value = '';
        }

        // --- NEWS ---
        function getNews() {
            return JSON.parse(localStorage.getItem('news') || JSON.stringify([
                {title: "Ouverture officielle de CrackFR !", desc: "Bienvenue à tous sur notre nouveau portail gaming."}
            ]));
        }
        function renderNews() {
            const list = getNews();
            let html = '';
            list.forEach((n, i) => {
                html += `<div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
                    <span class="font-bold text-white truncate pr-2">${n.title}</span>
                    <button onclick="let l=getNews(); l.splice(${i},1); localStorage.setItem('news', JSON.stringify(l)); renderNews();" class="px-2.5 py-1 bg-red-950/60 text-red-400 rounded-lg cursor-pointer shrink-0">✕</button>
                </div>`;
            });
            document.getElementById('news-list').innerHTML = html;
        }
        function addNews() {
            const title = document.getElementById('news-title').value;
            const desc = document.getElementById('news-desc').value;
            if(!title || !desc) return alert("Remplis le titre et la description !");
            let list = getNews();
            list.unshift({title, desc});
            localStorage.setItem('news', JSON.stringify(list));
            document.getElementById('news-title').value = '';
            document.getElementById('news-desc').value = '';
            renderNews();
            alert("News publiée !");
        }
    </script>
</body>
</html>
