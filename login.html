<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { opacity: 0; transition: opacity 0.5s ease-in-out; }</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-6 selection:bg-pink-500 selection:text-black">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-lg w-full space-y-6 text-center shadow-2xl">
        <h1 class="text-3xl font-black text-white uppercase tracking-wider bg-gradient-to-r from-white to-pink-400 bg-clip-text text-transparent">
            Bienvenue sur CrackFR
        </h1>
        <p class="text-xs text-slate-400 leading-relaxed">
            Plateforme communautaire et espace de gestion. Accède au portail de connexion staff sécurisé ci-dessous.
        </p>

        <div class="pt-4">
            <a href="login.html" class="inline-block w-full py-4 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-pink-600/20">
                🔐 Accès Portail Staff
            </a>
        </div>
    </div>

    <!-- Script de suivi des visiteurs pour le Panel Admin -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '1';

            // Enregistrement de la visite
            let visites = JSON.parse(localStorage.getItem('crackfr_visiteurs') || '[]');
            visites.unshift({
                id: Date.now(),
                page: document.title || "Accueil",
                time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                date: new Date().toLocaleDateString('fr-FR')
            });

            if (visites.length > 30) visites.pop();
            localStorage.setItem('crackfr_visiteurs', JSON.stringify(visites));
        });
    </script>
</body>
</html>
