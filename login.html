<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackFR - Connexion Staff 🔐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { opacity: 0; transition: opacity 0.4s ease-in-out; }</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-pink-500 selection:text-black">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl text-center">
        <div class="space-y-2">
            <span class="text-3xl">🔐</span>
            <h1 class="text-xl font-black text-white uppercase tracking-wider">Connexion Staff</h1>
            <p class="text-xs text-slate-400">Sélectionne ton rôle et entre ton mot de passe.</p>
        </div>

        <form onsubmit="event.preventDefault(); connecterAdmin();" class="space-y-4 text-left">
            <!-- Sélection du rôle -->
            <div class="space-y-1">
                <label for="role-select" class="text-xs font-bold uppercase tracking-wider text-slate-300 block">Rôle Staff :</label>
                <select id="role-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-pink-500 transition-colors">
                    <option value="Fondateur">👑 Fondateur</option>
                    <option value="Admin">⚡ Administrateur</option>
                    <option value="Modérateur">🛡️ Modérateur</option>
                </select>
            </div>

            <!-- Mot de passe -->
            <div class="space-y-1">
                <label for="password-input" class="text-xs font-bold uppercase tracking-wider text-slate-300 block">Mot de passe :</label>
                <input type="password" id="password-input" placeholder="••••••••" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-pink-500 transition-colors">
            </div>

            <button type="submit" class="w-full py-3.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-pink-600/20 cursor-pointer">
                Se connecter
            </button>
        </form>

        <div>
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">← Retour à l'accueil</a>
        </div>
    </div>

    <script>
        // Mots de passe par rôle (Modifie-les si tu veux)
        const PASSWORDS = {
            "Fondateur": "fondateur2026",
            "Admin": "admin123",
            "Modérateur": "modo123"
        };

        function connecterAdmin() {
            const selectedRole = document.getElementById('role-select').value;
            const inputPass = document.getElementById('password-input').value.trim();
            
            if (inputPass === PASSWORDS[selectedRole]) {
                localStorage.setItem('crackfr_logged_in', 'true');
                localStorage.setItem('crackfr_role', selectedRole);
                window.location.href = 'panel.html';
            } else {
                alert("Mot de passe incorrect pour le rôle " + selectedRole + " !");
                document.getElementById('password-input').value = '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '1';
            if (localStorage.getItem('crackfr_logged_in') === 'true') {
                window.location.href = 'panel.html';
            }
        });
    </script>
</body>
</html>
